<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background-color: #FAFAFA; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="phaseMap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B0000" />    <stop offset="16%" stop-color="#E74C3C" />   <stop offset="33.3%" stop-color="#F39C12" /> <stop offset="50%" stop-color="#F1C40F" />   <stop offset="66.6%" stop-color="#2ECC71" /> <stop offset="83%" stop-color="#1ABC9C" />   <stop offset="100%" stop-color="#2980B9" />  </linearGradient>

    <filter id="glow" x="-50%" y="-20%" width="200%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C3E50" />
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#2C3E50">Prime-Wave Phase Transition</text>

  <rect x="100" y="50" width="600" height="330" fill="url(#phaseMap)" rx="4" />

  <g stroke="#ffffff" fill="none" opacity="0.3" stroke-width="1.5">
    <path d="M 100 90 C 200 110, 250 190, 300 190 C 350 190, 450 130, 700 90" />
    <path d="M 100 150 C 200 170, 250 240, 300 240 C 350 240, 450 190, 700 150" />
    <path d="M 100 210 C 200 230, 250 290, 300 290 C 350 290, 450 250, 700 210" />
    <path d="M 100 270 C 200 290, 250 340, 300 340 C 350 340, 450 310, 700 270" />
  </g>

  <g stroke="#ffffff" fill="none" stroke-width="1.5">
    <ellipse cx="300" cy="215" rx="35" ry="90" opacity="0.25" />
    <ellipse cx="300" cy="215" rx="22" ry="65" opacity="0.35" />
    <ellipse cx="300" cy="215" rx="10" ry="40" opacity="0.5" />
    <path d="M 265 215 C 265 245, 335 245, 335 215" opacity="0.4" stroke-dasharray="3,3"/>
    <path d="M 265 215 C 265 185, 335 185, 335 215" opacity="0.7"/>
  </g>

  <line x1="300" y1="50" x2="300" y2="380" stroke="#FFEA00" stroke-width="2.5" filter="url(#glow)" />
  
  <line x1="500" y1="50" x2="500" y2="380" stroke="#FFFFFF" stroke-dasharray="6,6" stroke-width="2" opacity="0.85" />

  <line x1="100" y1="380" x2="720" y2="380" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="100" y1="380" x2="100" y2="30" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)" />

  <line x1="300" y1="380" x2="300" y2="388" stroke="#2C3E50" stroke-width="2" />
  <text x="300" y="405" text-anchor="middle" font-size="14" font-weight="700" fill="#2C3E50">1/2</text>
  
  <line x1="500" y1="380" x2="500" y2="388" stroke="#2C3E50" stroke-width="2" />
  <text x="500" y="405" text-anchor="middle" font-size="14" font-weight="700" fill="#2C3E50">1</text>
  
  <text x="710" y="405" text-anchor="middle" font-size="15" font-weight="700" font-style="italic" fill="#2C3E50">σ</text>
  <text x="400" y="430" text-anchor="middle" font-size="13" font-weight="500" fill="#7F8C8D">Real part of s (Governance Boundary)</text>

  <g transform="translate(70, 215) rotate(-90)">
    <text x="0" y="0" text-anchor="middle" font-size="14" font-weight="600" fill="#2C3E50">Energy Density / Phase Correlation</text>
  </g>

  <text x="200" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" opacity="0.95">Unstable Phase</text>
  <text x="200" y="100" text-anchor="middle" font-size="12" font-weight="500" fill="#FFFFFF" opacity="0.85">(Supercritical)</text>

  <text x="400" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#2C3E50" opacity="0.9">Pre-critical</text>
  <text x="400" y="100" text-anchor="middle" font-size="12" font-weight="500" fill="#2C3E50" opacity="0.8">(Transition Region)</text>

  <text x="600" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" opacity="0.95">Stable Phase</text>
  <text x="600" y="100" text-anchor="middle" font-size="12" font-weight="500" fill="#FFFFFF" opacity="0.85">(Subcritical Damping)</text>

  <text x="310" y="365" font-size="13" font-weight="700" fill="#FFEA00" filter="url(#glow)">Critical Line</text>

  <g transform="translate(555, 65)">
    <rect x="0" y="0" width="130" height="60" fill="#FFFFFF" opacity="0.9" rx="4" stroke="#BDC3C7" stroke-width="1"/>
    <text x="65" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#2C3E50">Energy Density</text>
    <rect x="15" y="28" width="100" height="10" fill="url(#phaseMap)" rx="2" />
    <text x="15" y="52" font-size="10" font-weight="600" fill="#7F8C8D">High</text>
    <text x="115" y="52" text-anchor="end" font-size="10" font-weight="600" fill="#7F8C8D">Low</text>
  </g>
</svg>
